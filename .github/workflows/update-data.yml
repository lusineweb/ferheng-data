name: Daneyên ferhengê nû bike

on:
  schedule:
    # Wikimedia publishes a new dump on the 1st and the 20th of each month
    - cron: '17 4 3,22 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wîkîferheng dump
        run: |
          curl -fsSL -A "FerhengBot/1.0 (https://github.com/lusineweb/ferheng-data)" \
            -o dump.xml.bz2 https://dumps.wikimedia.org/kuwiktionary/latest/kuwiktionary-latest-pages-articles.xml.bz2
          curl -fsSL -o tewandin-verbs.json https://raw.githubusercontent.com/lusineweb/tewandin-data/main/src/data/verbs.json || echo '[]' > tewandin-verbs.json
      - run: npm ci
      - name: Extract
        run: |
          bunzip2 -c dump.xml.bz2 | node scripts/sections.mjs > ku-sections.jsonl
          node scripts/translations.mjs ku-sections.jsonl > en.json
          node scripts/fetch-images.mjs
          node scripts/extract.mjs ku-sections.jsonl tewandin-verbs.json
          node scripts/test.mjs
      - name: Commit when something changed
        run: |
          git config user.name "ferheng-bot"
          git config user.email "ferheng-bot@users.noreply.github.com"
          git add -A src/data data
          # manifest.json always gets a new date; only commit when the words themselves changed
          if git diff --cached --quiet -- src/data/index.txt src/data/shards; then
            echo "no changes"; git reset -q
          else
            git commit -m "Daneyên Wîkîferhengê: $(date -u +%Y-%m-%d)" && git push
          fi
